<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jardim da Isa · Flores Artesanais Eternas</title>
<meta name="description" content="Flores artesanais eternas, feitas com carinho e atenção. Segue o Jardim da Isa no Instagram e no Facebook.">
<meta property="og:title" content="Jardim da Isa · Flores Artesanais Eternas">
<meta property="og:description" content="Flores artesanais eternas, feitas com carinho e atenção.">
<meta property="og:image" content="logo.jpg">
<link rel="icon" href="logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1f6b35; --green:#d7262e; --gold:#f2c230;
    --bg:#fffdf6; --card:#ffffff; --text:#1f6b35; --muted:#55604f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:var(--bg);
    background-image:radial-gradient(circle at 15% 10%,rgba(215,38,46,.07),transparent 45%),
                     radial-gradient(circle at 85% 90%,rgba(242,194,48,.18),transparent 45%);
    font-family:'Montserrat',system-ui,sans-serif;color:var(--text);padding:24px 16px;
  }
  main{width:100%;max-width:400px;text-align:center}
  .logo{width:230px;height:230px;border-radius:24px;object-fit:contain;padding:8px;
        box-shadow:0 8px 30px rgba(20,48,95,.12);background:#fff}
  h1{font-family:'Dancing Script',cursive;font-weight:700;font-size:2.4rem;margin-top:20px;letter-spacing:.02em}
  .tag{color:var(--green);font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;margin-top:4px}
  .lead{color:var(--muted);font-size:.95rem;line-height:1.5;margin:18px auto 28px;max-width:320px}
  .btn{display:flex;align-items:center;justify-content:center;gap:12px;
       width:100%;padding:16px 20px;margin-bottom:14px;border-radius:14px;
       font-weight:600;font-size:1rem;text-decoration:none;color:#fff;
       transition:transform .15s ease, box-shadow .15s ease}
  .btn:active{transform:scale(.98)}
  .btn:hover{box-shadow:0 6px 18px rgba(0,0,0,.15)}
  .btn svg{width:24px;height:24px;flex:none}
  .ig{background:linear-gradient(45deg,#f09433,#e6683c 25%,#dc2743 50%,#cc2366 75%,#bc1888)}
  .fb{background:#1877f2}
  .divider{width:60px;height:2px;background:var(--gold);margin:28px auto 14px;border-radius:2px}
  footer{font-size:.75rem;color:var(--muted)}
</style>
</head>

<main>
